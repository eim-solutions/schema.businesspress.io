# Add these locations after the existing `location /` block in the Forge site
# Nginx configuration. Keep the rest of Forge's generated configuration intact.

location = /api/inspect.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    fastcgi_hide_header X-Powered-By;
}

# Never expose another PHP file from this otherwise-static site.
location ~ \.php$ {
    return 404;
}
